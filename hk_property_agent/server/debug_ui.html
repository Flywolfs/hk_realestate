<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>港房通 Agent 调试界面</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      display: flex;
      height: 100vh;
    }

    /* ===== 左侧配置面板 ===== */
    .sidebar {
      width: 280px;
      background: #fff;
      border-right: 1px solid #e8e8e8;
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      gap: 16px;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .sidebar h2 {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a2e;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar h2 .icon { font-size: 20px; }

    .field-group { display: flex; flex-direction: column; gap: 6px; }

    .field-group label {
      font-size: 12px;
      color: #888;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .field-group input, .field-group select {
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .field-group input:focus, .field-group select:focus {
      border-color: #4e6ef2;
    }

    .btn {
      padding: 9px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.85; }

    .btn-primary { background: #4e6ef2; color: #fff; }
    .btn-danger  { background: #ff4d4f; color: #fff; }
    .btn-ghost   { background: #f5f5f5; color: #333; border: 1px solid #ddd; }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }

    .status-ok   { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }
    .status-err  { background: #fff2f0; color: #ff4d4f; border: 1px solid #ffa39e; }
    .status-warn { background: #fffbe6; color: #faad14; border: 1px solid #ffe58f; }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .divider {
      border: none;
      border-top: 1px solid #f0f0f0;
    }

    .quick-btns { display: flex; flex-direction: column; gap: 6px; }

    .quick-btn {
      padding: 7px 10px;
      background: #f7f8ff;
      border: 1px solid #e0e4ff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      color: #4e6ef2;
      text-align: left;
      transition: background 0.15s;
    }

    .quick-btn:hover { background: #eaedff; }

    /* ===== 主聊天区域 ===== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-header {
      background: #fff;
      border-bottom: 1px solid #e8e8e8;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-header h1 {
      font-size: 17px;
      font-weight: 600;
      color: #1a1a2e;
    }

    .chat-header .meta {
      font-size: 12px;
      color: #aaa;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg {
      display: flex;
      gap: 10px;
      max-width: 80%;
    }

    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot  { align-self: flex-start; }
    .msg.sys  { align-self: center; max-width: 100%; }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .avatar.user-av { background: #4e6ef2; }
    .avatar.bot-av  { background: #18a058; }

    .bubble {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user .bubble {
      background: #4e6ef2;
      color: #fff;
      border-bottom-right-radius: 3px;
    }

    .msg.bot .bubble {
      background: #fff;
      color: #222;
      border: 1px solid #e8e8e8;
      border-bottom-left-radius: 3px;
    }

    .msg.sys .bubble {
      background: #f5f5f5;
      color: #888;
      font-size: 12px;
      text-align: center;
      border-radius: 8px;
    }

    .msg-time {
      font-size: 11px;
      color: #bbb;
      margin-top: 4px;
      padding: 0 4px;
      align-self: flex-end;
    }

    /* 打字动画 */
    .typing { display: flex; align-items: center; gap: 4px; padding: 12px 16px; }
    .typing span {
      width: 7px; height: 7px;
      background: #bbb;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%           { transform: translateY(-6px); }
    }

    /* ===== 输入区 ===== */
    .input-bar {
      background: #fff;
      border-top: 1px solid #e8e8e8;
      padding: 14px 20px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #msgInput {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      resize: none;
      outline: none;
      max-height: 120px;
      line-height: 1.5;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    #msgInput:focus { border-color: #4e6ef2; }

    #sendBtn {
      padding: 10px 20px;
      background: #4e6ef2;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ===== 右侧日志面板 ===== */
    .log-panel {
      width: 300px;
      background: #1e1e2e;
      color: #cdd6f4;
      display: flex;
      flex-direction: column;
      border-left: 1px solid #313244;
      flex-shrink: 0;
    }

    .log-header {
      padding: 12px 16px;
      border-bottom: 1px solid #313244;
      font-size: 13px;
      font-weight: 600;
      color: #cba6f7;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .log-clear {
      font-size: 11px;
      color: #6c7086;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .log-clear:hover { color: #cdd6f4; background: #313244; }

    #logBox {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      font-size: 11px;
      font-family: "JetBrains Mono", "Fira Code", monospace;
      line-height: 1.7;
    }

    .log-line { margin-bottom: 2px; }
    .log-info  { color: #a6e3a1; }
    .log-warn  { color: #f9e2af; }
    .log-error { color: #f38ba8; }
    .log-req   { color: #89b4fa; }
    .log-res   { color: #cba6f7; }
    .log-time  { color: #6c7086; }

    /* Tool status indicator */
    .tool-status {
      font-size: 12px;
      color: #888;
      padding: 4px 8px;
      background: #f5f5f5;
      border-radius: 4px;
      margin-bottom: 4px;
      display: inline-block;
    }

    /* Streaming cursor */
    .streaming-cursor::after {
      content: '\u2588';
      animation: blink 0.8s infinite;
      color: #4e6ef2;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0; }
    }
  </style>
</head>
<body>

<!-- ===== 左侧配置面板 ===== -->
<aside class="sidebar">
  <h2><span class="icon">🏠</span>港房通 调试台</h2>

  <div class="field-group">
    <label>服务地址</label>
    <input id="serverUrl" type="text" value="http://localhost:5001" />
  </div>

  <div class="field-group">
    <label>Session ID（模拟 openid）</label>
    <input id="sessionId" type="text" value="debug_user_001" />
  </div>

  <div class="field-group">
    <label>Bearer Token（留空跳过鉴权）</label>
    <input id="bearerToken" type="text" placeholder="可选，本地调试通常留空" />
  </div>

  <div class="field-group">
    <label>Admin Token（热更新用）</label>
    <input id="adminToken" type="text" placeholder="可选" />
  </div>

  <div class="field-group">
    <label>输出模式</label>
    <div style="display:flex;align-items:center;gap:8px;">
      <label style="font-size:13px;color:#333;text-transform:none;letter-spacing:0;">
        <input type="checkbox" id="streamToggle" checked /> 流式输出
      </label>
    </div>
  </div>

  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <button class="btn btn-ghost" onclick="checkHealth()" style="flex:1">健康检查</button>
    <button class="btn btn-ghost" onclick="checkStats()" style="flex:1">查统计</button>
  </div>

  <div id="healthStatus" class="status-badge status-warn">
    <div class="dot"></div> 未检测
  </div>

  <hr class="divider" />

  <div class="field-group">
    <label>快捷测试问题</label>
    <div class="quick-btns">
      <button class="quick-btn" onclick="sendQuick('查一下太古城的基本信息')">太古城基本信息</button>
      <button class="quick-btn" onclick="sendQuick('沙田有什么屋苑，租售比怎么样？')">沙田屋苑列表</button>
      <button class="quick-btn" onclick="sendQuick('太古城的租售比是多少？近几个月有没有变化？')">太古城租售比</button>
      <button class="quick-btn" onclick="sendQuick('查一下嘉湖山庄近12个月的尺价走势')">嘉湖山庄尺价趋势</button>
      <button class="quick-btn" onclick="sendQuick('帮我对比太古城、康怡花园和嘉湖山庄')">三盘横向对比</button>
      <button class="quick-btn" onclick="sendQuick('有没有将军澳租售比比较高的大型屋苑？')">语义检索</button>
      <button class="quick-btn" onclick="sendQuick('尺价低于1万，租售比高于4%的屋苑有哪些？')">结构化筛选</button>
      <button class="quick-btn" onclick="sendQuick('将军澳整体情况怎么样？')">地区统计</button>
      <button class="quick-btn" onclick="sendQuick('太古城最近成交量如何？')">成交量查询</button>
      <button class="quick-btn" onclick="sendQuick('太古城两房租金多少？')">租金查询</button>
    </div>
  </div>

  <hr class="divider" />

  <button class="btn btn-danger" onclick="clearSession()" style="width:100%">清除对话历史</button>
  <button class="btn btn-ghost" onclick="reloadData()" style="width:100%">触发热更新</button>
</aside>

<!-- ===== 主聊天区域 ===== -->
<div class="main">
  <header class="chat-header">
    <h1>港房通 · 香港房产 AI 咨询</h1>
    <span class="meta" id="headerMeta">等待连接…</span>
  </header>

  <div class="messages" id="msgList">
    <div class="msg sys">
      <div class="bubble">欢迎使用港房通调试界面。请先点击左侧「健康检查」确认服务已启动。</div>
    </div>
  </div>

  <div class="input-bar">
    <textarea id="msgInput" rows="1" placeholder="输入问题，Enter 发送，Shift+Enter 换行…"></textarea>
    <button id="sendBtn" onclick="sendMessage()">发 送</button>
  </div>
</div>

<!-- ===== 右侧日志面板 ===== -->
<div class="log-panel">
  <div class="log-header">
    请求日志
    <span class="log-clear" onclick="clearLogs()">清空</span>
  </div>
  <div id="logBox"></div>
</div>


<script>
  // ============================================================
  // 工具函数
  // ============================================================
  const $ = id => document.getElementById(id);

  function getBase()  { return $('serverUrl').value.replace(/\/$/, ''); }
  function getSid()   { return $('sessionId').value.trim() || 'debug_user'; }
  function getToken() { return $('bearerToken').value.trim(); }
  function getAdmin() { return $('adminToken').value.trim(); }

  function now() {
    return new Date().toLocaleTimeString('zh-CN', { hour12: false });
  }

  function log(msg, type = 'info') {
    const box = $('logBox');
    const line = document.createElement('div');
    line.className = `log-line log-${type}`;
    line.textContent = `[${now()}] ${msg}`;
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
  }

  function clearLogs() { $('logBox').innerHTML = ''; }

  // ============================================================
  // 聊天消息渲染
  // ============================================================
  function appendMsg(role, text) {
    const list = $('msgList');

    const wrapper = document.createElement('div');
    wrapper.className = `msg ${role}`;

    if (role === 'sys') {
      wrapper.innerHTML = `<div class="bubble">${escHtml(text)}</div>`;
    } else {
      const emoji = role === 'user' ? '🙂' : '🤖';
      const avClass = role === 'user' ? 'user-av' : 'bot-av';
      wrapper.innerHTML = `
        <div class="avatar ${avClass}">${emoji}</div>
        <div>
          <div class="bubble">${escHtml(text)}</div>
          <div class="msg-time">${now()}</div>
        </div>`;
    }

    list.appendChild(wrapper);
    list.scrollTop = list.scrollHeight;
    return wrapper;
  }

  function showTyping() {
    const list = $('msgList');
    const el = document.createElement('div');
    el.className = 'msg bot';
    el.id = 'typingIndicator';
    el.innerHTML = `
      <div class="avatar bot-av">🤖</div>
      <div class="bubble typing">
        <span></span><span></span><span></span>
      </div>`;
    list.appendChild(el);
    list.scrollTop = list.scrollHeight;
  }

  function hideTyping() {
    const el = $('typingIndicator');
    if (el) el.remove();
  }

  function escHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ============================================================
  // API 请求封装
  // ============================================================
  async function apiCall(path, method = 'GET', body = null, extraHeaders = {}) {
    const url = getBase() + path;
    const headers = { 'Content-Type': 'application/json', ...extraHeaders };
    const token = getToken();
    if (token) headers['Authorization'] = `Bearer ${token}`;
    // 模拟云托管 header（供本地调试鉴权）
    headers['X-WX-FROM-OPENID'] = getSid();

    log(`→ ${method} ${path}`, 'req');

    const opts = { method, headers };
    if (body) opts.body = JSON.stringify(body);

    const t0 = Date.now();
    try {
      const resp = await fetch(url, opts);
      const data = await resp.json();
      log(`← ${resp.status} (${Date.now() - t0}ms)`, resp.ok ? 'res' : 'error');
      return { ok: resp.ok, status: resp.status, data };
    } catch (e) {
      log(`✗ 网络错误: ${e.message}`, 'error');
      return { ok: false, data: { error: e.message } };
    }
  }

  // ============================================================
  // 健康检查
  // ============================================================
  async function checkHealth() {
    log('执行健康检查…', 'info');
    const { ok, data } = await apiCall('/api/agent/health');
    const badge = $('healthStatus');

    if (ok && data.success) {
      const s = data.data_stats || {};
      badge.className = 'status-badge status-ok';
      badge.innerHTML = `<div class="dot"></div> 在线 · ${s.total_estates || '?'} 屋苑`;
      $('headerMeta').textContent = `${s.total_estates || '?'} 个屋苑 · ${s.total_areas || '?'} 个地区`;
      log(`服务正常，屋苑: ${s.total_estates}，地区: ${s.total_areas}`, 'info');
    } else {
      badge.className = 'status-badge status-err';
      badge.innerHTML = `<div class="dot"></div> 离线`;
      $('headerMeta').textContent = '连接失败';
      log(`健康检查失败: ${data.error || '未知'}`, 'error');
    }
  }

  // ============================================================
  // 统计
  // ============================================================
  async function checkStats() {
    const admin = getAdmin();
    const headers = admin ? { 'X-Admin-Token': admin } : {};
    const { ok, data } = await apiCall('/api/agent/stats', 'GET', null, headers);
    if (ok && data.success) {
      log(`活跃会话: ${data.active_sessions}，向量索引: ${data.vector_index_ready ? '就绪' : '未建'}`, 'info');
      appendMsg('sys', `📊 统计：活跃会话 ${data.active_sessions} 个，向量索引${data.vector_index_ready ? '已就绪' : '未构建'}`);
    } else {
      log(`获取统计失败: ${JSON.stringify(data)}`, 'warn');
    }
  }

  // ============================================================
  // 发送消息
  // ============================================================
  let sending = false;

  function isStreamMode() { return $('streamToggle').checked; }

  async function sendMessage() {
    if (sending) return;
    const input = $('msgInput');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = 'auto';
    sending = true;
    $('sendBtn').disabled = true;

    appendMsg('user', text);
    log(`用户: ${text.slice(0, 60)}${text.length > 60 ? '…' : ''}`, 'info');

    if (isStreamMode()) {
      await sendMessageStream(text);
    } else {
      await sendMessageSync(text);
    }

    sending = false;
    $('sendBtn').disabled = false;
    input.focus();
  }

  // ── 同步模式 ──
  async function sendMessageSync(text) {
    showTyping();
    const { ok, data } = await apiCall('/api/agent/chat?sync=true', 'POST', { message: text });
    hideTyping();

    if (ok && data.success) {
      appendMsg('bot', data.reply);
      log(`回复长度: ${data.reply.length} 字`, 'res');
    } else {
      const err = data.error || '请求失败';
      appendMsg('sys', '\u26a0\ufe0f 错误: ' + err);
      log(`错误: ${err}`, 'error');
    }
  }

  // ── 流式模式 ──
  async function sendMessageStream(text) {
    const url = getBase() + '/api/agent/chat/stream';
    const headers = { 'Content-Type': 'application/json' };
    const token = getToken();
    if (token) headers['Authorization'] = `Bearer ${token}`;
    headers['X-WX-FROM-OPENID'] = getSid();

    log('\u2192 POST /api/agent/chat/stream (stream)', 'req');

    const { wrapper, bubbleEl, statusEl } = appendStreamBubble();

    try {
      const resp = await fetch(url, {
        method: 'POST',
        headers,
        body: JSON.stringify({ message: text }),
      });

      if (!resp.ok) {
        const errData = await resp.json().catch(() => ({}));
        const err = errData.error || errData.detail || `HTTP ${resp.status}`;
        bubbleEl.textContent = '\u26a0\ufe0f ' + err;
        bubbleEl.classList.remove('streaming-cursor');
        log(`\u2717 Stream error: ${err}`, 'error');
        return;
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let fullText = '';
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.trim()) continue;
          try {
            const event = JSON.parse(line);

            if (event.type === 'status') {
              statusEl.textContent = '\ud83d\udd0d ' + event.text;
              statusEl.style.display = 'inline-block';
              log(`[Tool] ${event.text}`, 'info');
            } else if (event.type === 'token') {
              statusEl.style.display = 'none';
              fullText += event.text;
              bubbleEl.textContent = fullText;
              $('msgList').scrollTop = $('msgList').scrollHeight;
            } else if (event.type === 'done') {
              log(`\u2190 Stream done (${fullText.length} chars)`, 'res');
            }
          } catch (e) { /* skip malformed lines */ }
        }
      }

      bubbleEl.classList.remove('streaming-cursor');
      statusEl.style.display = 'none';
      if (!fullText) bubbleEl.textContent = '(无回复内容)';

    } catch (e) {
      bubbleEl.textContent = '\u26a0\ufe0f 网络错误: ' + e.message;
      bubbleEl.classList.remove('streaming-cursor');
      log(`\u2717 Stream network error: ${e.message}`, 'error');
    }
  }

  function appendStreamBubble() {
    const list = $('msgList');
    const wrapper = document.createElement('div');
    wrapper.className = 'msg bot';

    const statusEl = document.createElement('div');
    statusEl.className = 'tool-status';
    statusEl.style.display = 'none';

    const bubbleEl = document.createElement('div');
    bubbleEl.className = 'bubble streaming-cursor';

    wrapper.innerHTML = '<div class="avatar bot-av">\ud83e\udd16</div><div></div>';
    const contentDiv = wrapper.querySelector('div:last-child');
    contentDiv.appendChild(statusEl);
    contentDiv.appendChild(bubbleEl);

    const timeEl = document.createElement('div');
    timeEl.className = 'msg-time';
    timeEl.textContent = now();
    contentDiv.appendChild(timeEl);

    list.appendChild(wrapper);
    list.scrollTop = list.scrollHeight;
    return { wrapper, bubbleEl, statusEl };
  }

  function sendQuick(text) {
    $('msgInput').value = text;
    sendMessage();
  }

  // ============================================================
  // 清除会话
  // ============================================================
  async function clearSession() {
    const { ok, data } = await apiCall('/api/agent/clear', 'POST');
    if (ok && data.success) {
      appendMsg('sys', '🗑️ 对话历史已清除，开始新对话');
      log('会话历史已清除', 'info');
    } else {
      log(`清除失败: ${data.error}`, 'error');
    }
  }

  // ============================================================
  // 热更新
  // ============================================================
  async function reloadData() {
    const admin = getAdmin();
    const headers = admin ? { 'X-Admin-Token': admin } : {};
    appendMsg('sys', '⏳ 正在触发数据热更新，请稍候…');
    log('触发热更新…', 'warn');
    const { ok, data } = await apiCall('/api/agent/reload', 'POST', {}, headers);
    if (ok && data.success) {
      const s = data.stats || {};
      appendMsg('sys', `✅ 热更新完成：${s.total_estates || '?'} 个屋苑`);
      log(`热更新成功，屋苑数: ${s.total_estates}`, 'info');
    } else {
      appendMsg('sys', `❌ 热更新失败：${data.error || '未知错误'}`);
      log(`热更新失败: ${data.error}`, 'error');
    }
  }

  // ============================================================
  // 输入框自适应高度 + Enter 快捷键
  // ============================================================
  $('msgInput').addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });

  $('msgInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // 页面加载后自动健康检查
  window.addEventListener('load', () => {
    setTimeout(checkHealth, 500);
  });
</script>
</body>
</html>
